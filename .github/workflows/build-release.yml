name: Build and Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
          - goarch: arm64
            suffix: arm64
          - goarch: arm
            goarm: 7
            suffix: armv7
          - goarch: ppc64le
            suffix: ppc64le
          - goarch: s390x
            suffix: s390x
          - goarch: riscv64
            suffix: riscv64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compile 1Panel
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          make build_frontend
          cd core && go build -trimpath -ldflags '-s -w' -o ../build/1panel-core cmd/server/main.go && cd ..
          cd agent && go build -trimpath -ldflags '-s -w' -o ../build/1panel-agent cmd/server/main.go && cd ..

      - name: Package Assets
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            TAG_NAME="manual"
          fi

          DIR_NAME="1panel-${TAG_NAME}-linux-${{ matrix.suffix }}"
          mkdir -p "$DIR_NAME"

          cp build/1panel-core "$DIR_NAME/"
          cp build/1panel-agent "$DIR_NAME/"
          cp -r script/* "$DIR_NAME/"

          tar -czvf "${DIR_NAME}.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME"

      - name: Upload Artifact (Manual Run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-manual-${{ matrix.suffix }}
          path: 1panel-*.tar.gz

      - name: Create Release and Upload Assets (Tag Trigger)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: 1panel-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
